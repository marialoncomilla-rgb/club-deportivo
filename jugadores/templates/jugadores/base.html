<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Club Deportivo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f3f6f8;color:#17212b}.navbar{background:#123b2a}.brand-mark{font-weight:800;letter-spacing:.5px}
    .hero{background:linear-gradient(120deg,#123b2a,#23734c);color:white;border-radius:22px}
    .card{border:0;border-radius:16px;box-shadow:0 6px 22px rgba(15,35,25,.07)}
    .btn-success{background:#176b45;border-color:#176b45}.btn-success:hover{background:#105236}
    .form-control,.form-select{padding:.7rem;border-radius:10px}.table thead th{background:#e8f1eb}
    footer{color:#6c757d}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
 <div class="container">
  <a class="navbar-brand brand-mark" href="{% url 'jugadores:inicio' %}">⚽ CLUB DEPORTIVO</a>
  <div class="navbar-nav ms-auto">
   <a class="nav-link" href="{% url 'jugadores:inicio' %}">Inicio</a>
   <a class="nav-link" href="{% url 'jugadores:lista_jugadores' %}">Jugadores</a>
   <a class="nav-link" href="{% url 'jugadores:crear_jugador' %}">Registrar jugador</a>
  </div>
 </div>
</nav>
<main class="container py-4">
 {% if messages %}{% for message in messages %}
 <div class="alert alert-success alert-dismissible fade show" role="alert">{{ message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
 </div>
 {% endfor %}{% endif %}
 {% block content %}{% endblock %}
</main>
<footer class="container text-center py-4 small">Sistema de Gestión de Jugadores · Proyecto académico</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
